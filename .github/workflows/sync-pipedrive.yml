name: Sync Pipedrive data

on:
  schedule:
    # Runs daily at 13:00 UTC. Cron is always UTC — adjust for your timezone.
    # You can also trigger this manually any time from the Actions tab.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Pipedrive sync
        env:
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          PIPEDRIVE_DOMAIN: ${{ vars.PIPEDRIVE_DOMAIN }}
        run: python scripts/sync_pipedrive.py

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/leads.json; then
            echo "No changes to data/leads.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.json
          git commit -m "Sync Pipedrive leads ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
